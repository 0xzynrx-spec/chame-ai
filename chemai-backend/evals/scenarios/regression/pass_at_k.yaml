dimension: pass_at_k
tier: regression
description: "验证多次运行的结果多样性和稳定性"
pass_criteria: "方差 < 0.1"
judge: true

scenarios:
  - id: PASS-001
    name: 出题多次运行一致性
    input: "生成5道氧化还原选择题"
    repeat: 5
    scoring_dimensions:
      - name: chemistry_correctness
        type: scale
        scale: 0-5
        anchors:
          5: "化学原理完全正确，方程式配平无误"
          3: "基本正确但有小瑕疵"
          1: "存在明显化学错误"
      - name: completeness
        type: scale
        scale: 0-5
        anchors:
          5: "5道题全部完整，含题干、选项、答案、解析"
          3: "大部分完整但有个别缺失"
          1: "严重不完整"
      - name: consistency
        type: scale
        scale: 0-5
        anchors:
          5: "5次生成质量稳定，分数方差 < 0.1"
          3: "质量基本稳定，方差 0.1-0.2"
          1: "质量波动大，方差 > 0.2"

  - id: PASS-002
    name: 错题诊断多次运行一致性
    input: "分析这道错题的障碍类型"
    repeat: 3
    scoring_dimensions:
      - name: chemistry_correctness
        type: scale
        scale: 0-5
        anchors:
          5: "障碍类型判定准确，理由充分"
          3: "判定基本正确但理由不充分"
          1: "判定明显错误"
      - name: consistency
        type: scale
        scale: 0-5
        anchors:
          5: "3次诊断方向一致，分数方差 < 0.1"
          3: "方向基本一致，方差 0.1-0.2"
          1: "诊断方向不一致"

  - id: PASS-003
    name: 教案生成多次运行一致性
    input: "生成一份氧化还原的教案"
    repeat: 3
    scoring_dimensions:
      - name: chemistry_correctness
        type: scale
        scale: 0-5
        anchors:
          5: "化学知识完全正确"
          3: "基本正确但有小瑕疵"
          1: "存在明显错误"
      - name: completeness
        type: scale
        scale: 0-5
        anchors:
          5: "包含引入→讲解→练习→总结四环节"
          3: "有主要环节但不完整"
          1: "缺少核心环节"
      - name: consistency
        type: scale
        scale: 0-5
        anchors:
          5: "3份教案结构一致，质量稳定"
          3: "结构基本一致但有差异"
          1: "结构和质量差异过大"

  - search_question_bank
  - search_web_questions
  - generate_question
  - generate_exam
  - batch_generate
  - smart_recommend
  - generate_variant
  - export_exam_docx
  - show_exam_workbench
  - save_to_bank
  - list_questions
  - delete_question
  # 诊断
  - diagnose_barrier
  - show_diagnosis
  - show_students
  - weekly_report
  - assign_adaptive_practice
  - generate_learning_plan
  - send_learning_plan
  - analyze_errors
  - weak_point_diagnosis
  - class_diagnosis_report
  - generate_error_profile
  - knowledge_graph_locate
  - exam_report
  - trend_analysis
  # 辅导
  - chemistry_tutor
  - balance_equation
  - explain_concept
  - formula_lookup
  - adapt_difficulty
  # 批改
  - query_ocr_progress
  - grade_answer_sheets
  - save_grading_results
  - grade_subjective
  - batch_grade
  - generate_rubric
  # 记忆
  - memory_student_get

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>AI 助教 — ChemAI 智辅化学</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<!-- KaTeX + mhchem -->
<link href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- Vue 3 CDN -->
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<!-- Tailwind Configuration — ChemAI 设计系统（与 exam-v2 一致） -->
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "oxford-blue": "#002147",
        "oxford-hover": "#001a38",
        "teal-accent": "#0d7377",
        "teal-hover": "#0a5c5f",
        "warm-paper": "#faf8f5",
        "warm-bg": "#f5f0e8",
        "text-primary": "#1a1a2e",
        "text-secondary": "#6b7280",
        "error-red": "#b43c28",
        "pass-green": "#2c6e49",
      },
      fontFamily: {
        "headline": ["Cormorant Garamond", "serif"],
        "body": ["IBM Plex Sans", "Noto Sans SC", "sans-serif"],
        "chem": ["JetBrains Mono", "IBM Plex Mono", "monospace"],
      },
    },
  },
}
</script>

<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
body { font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif; }

/* 学生端 430px 视口容器 */
.app { max-width: 430px; margin: 0 auto; min-height: 100dvh; position: relative; background: #faf8f5; }

/* 底部 4-Tab 导航 */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto;
  max-width: 430px; height: 56px; display: flex; background: #ffffff;
  border-top: 1px solid #eeeeee; z-index: 20;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: #8b8b9c; font-size: 10px; text-decoration: none;
}
.nav-item .material-symbols-outlined { font-size: 22px; }
.nav-item.active { color: #002147; }
.nav-item.active span:last-child { font-weight: 600; }
main { padding-bottom: 72px; }
</style>
</head>
<body class="bg-warm-bg text-text-primary">
<div class="app" id="app">
  <!-- 顶部标题栏 -->
  <header class="h-14 flex items-center justify-between px-4 bg-oxford-blue text-white sticky top-0 z-10">
    <div class="w-10"></div>
    <h1 class="text-base font-semibold">AI 助教</h1>
    <div class="w-10"></div>
  </header>

  <!-- 主体：占位 -->
  <main class="p-4">
    <div class="flex flex-col items-center justify-center py-24 text-center">
      <span class="material-symbols-outlined text-5xl text-teal-accent">smart_toy</span>
      <p class="mt-4 text-sm text-text-secondary">AI 助教对话功能建设中，敬请期待</p>
      <p class="mt-2 text-xs text-text-secondary">当前可前往「练习」「错题」开始学习</p>
    </div>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html">
      <span class="material-symbols-outlined">smart_toy</span><span>AI助教</span>
    </a>
    <a class="nav-item" href="practice.html">
      <span class="material-symbols-outlined">edit_note</span><span>练习</span>
    </a>
    <a class="nav-item" href="wrong.html">
      <span class="material-symbols-outlined">fact_check</span><span>错题</span>
    </a>
    <a class="nav-item" href="#">
      <span class="material-symbols-outlined">person</span><span>我的</span>
    </a>
  </nav>
</div>

<script src="common.js"></script>
<script>
const { createApp } = Vue;
createApp({ data() { return {}; } }).mount('#app');
</script>
</body>
</html>
